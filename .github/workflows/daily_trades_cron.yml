name: BVC Daily Trades Extraction

on:
  schedule:
    # 23:30 UTC = 18:30 COT (6:30 PM Colombia Time).
    # Runs Monday to Friday (days 1-5 in UTC).
    - cron: '30 23 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub web UI

jobs:
  extract-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyarrow

      - name: Run BVC Daily Extractor
        env:
          BVC_USER: ${{ secrets.BVC_USER }}
          BVC_PASS: ${{ secrets.BVC_PASS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python extractor.py --daily --format parquet --push-supabase

      - name: Archive Parquet Data Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bvc-trades-daily
          path: data/*.parquet
          retention-days: 90
